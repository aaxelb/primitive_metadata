[project]
name = "primitive_metadata"
version = "0.2025.0"
authors = [
  { name="abram axel booth", email="boothaa@gmail.com" },
]
description = "a (simple?) toolset for authoring and gathering metadata as rdf"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/aaxelb/primitive_metadata"
Issues = "https://github.com/aaxelb/primitive_metadata/issues"

[build-system]
requires = ["flit_core>=3.11"]
build-backend = "flit_core.buildapi"
